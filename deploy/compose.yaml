name: claim-verifier-beta

x-runtime: &runtime
  image: ${BETA_IMAGE:-claim-verifier:beta}
  build:
    context: ..
    dockerfile: Dockerfile
    target: release
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  tmpfs: ["/tmp:rw,nosuid,size=268435456,mode=1777"]
  restart: unless-stopped
  stop_grace_period: 30s
  env_file: ${BETA_ENV_FILE:-.env}
  environment: &environment
    CUSTOMER_DATA_ROOT: ${CUSTOMER_DATA_ROOT:-/var/lib/verifier/customer_data}
    CUSTOMER_MAX_UPLOAD_MB: "10"
    CUSTOMER_MAX_PAGES: "500"
    CUSTOMER_MAX_DOCUMENTS: "30"
    CUSTOMER_JOBS_PER_DAY: "100"
    CUSTOMER_MAX_PAGE_PIXELS: "25000000"
    CUSTOMER_MAX_RENDER_DIMENSION: "10000"
    CUSTOMER_JOB_TIMEOUT_SECONDS: "1800"
    GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
    GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  web:
    <<: *runtime
    command: [web]
    ports: ["127.0.0.1:${BETA_PORT:-8501}:8501"]
    volumes: ["customer-data:/var/lib/verifier"]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, deploy/healthcheck.py, web]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  worker:
    <<: *runtime
    command: [worker]
    volumes: ["customer-data:/var/lib/verifier"]
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: [CMD, python, deploy/healthcheck.py, worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
  backup:
    <<: *runtime
    profiles: [tools]
    restart: "no"
    network_mode: none
    entrypoint: [python, scripts/backup_restore.py]
    command: ["--help"]
    volumes:
      - customer-data:/var/lib/verifier
      - ${BETA_BACKUP_ROOT:-backups}:/backups
      - ${BETA_BACKUP_KEY_ROOT:-backup-secrets}:/backup-secrets
    mem_limit: 512m
    cpus: 1.0
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs: ["/tmp:rw,nosuid,size=67108864,mode=1777"]
    environment:
      BETA_HOST: ${BETA_HOST:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  customer-data:
  backups:
  backup-secrets:
  caddy-data:
  caddy-config:
