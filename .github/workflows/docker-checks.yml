name: Docker checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show hosted disk capacity
        run: df -h / /var/lib/docker

      - name: Build, audit and test isolated fixtures
        id: checks
        shell: pwsh
        run: ./deploy/test-docker.ps1 -ImageScanner trivy

      - name: Upload results even when a check fails
        if: always() && steps.checks.outputs.record != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-check-results
          path: |
            ${{ steps.checks.outputs.record }}/RESULT.json
            ${{ steps.checks.outputs.record }}/docker.log
            ${{ steps.checks.outputs.record }}/image-audit.sarif.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
